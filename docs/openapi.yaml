openapi: 3.1.0
info:
  title: Smooth Flow API
  version: 0.1.0
  description: API REST para gestión de agendamiento clínico en tiempo real.

servers:
  - url: /api
    description: API base path

paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK

  /auth/login:
    post:
      summary: Iniciar sesión (personal)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        "200":
          description: Sesión creada (cookie)

  /auth/logout:
    post:
      summary: Cerrar sesión
      responses:
        "200":
          description: Sesión destruida

  /auth/me:
    get:
      summary: Usuario autenticado
      responses:
        "200":
          description: Datos de sesión

  /auth/patient/register:
    post:
      summary: Autoregistro de paciente (portal)
      description: >
        Crea cuenta de portal. Si ya existe una ficha administrativa con el mismo email o RUT
        (creada por secretaría), vincula la cuenta a esa ficha sin duplicar el registro.
      responses:
        "201":
          description: Cuenta creada o vinculada a ficha existente
        "409":
          description: Email ya registrado o paciente ya tiene cuenta de portal

  /appointments:
    get:
      summary: Listar citas
    post:
      summary: Crear cita

  /appointments/{id}:
    patch:
      summary: Actualizar o cancelar cita

  /appointments/blocks:
    post:
      summary: Bloquear rango de agenda (secretaria/dueño)
      responses:
        "201":
          description: Bloqueo registrado
        "409":
          description: Existen citas confirmadas en el rango (BLOCK_CONFLICT)

  /availability:
    get:
      summary: Consultar disponibilidad

  /patients:
    get:
      summary: Listar pacientes (secretaria/dueño)
      responses:
        "200":
          description: Lista de fichas con hasPortalAccess
    post:
      summary: Crear ficha de paciente
      responses:
        "201":
          description: Ficha creada
        "409":
          description: Email o RUT ya registrado en la clínica

  /owner/staff:
    get:
      summary: Listar personal
    post:
      summary: Crear usuario de personal

  /owner/staff/{id}/unlink:
    post:
      summary: Desvincular usuario y revocar sesiones

  /owner/specialties:
    get:
      summary: Listar especialidades
    post:
      summary: Crear especialidad

  /owner/practitioners:
    get:
      summary: Listar médicos
    post:
      summary: Crear médico

  /owner/schedules:
    get:
      summary: Listar horarios base
    post:
      summary: Crear horario base

  /owner/reports/occupancy:
    get:
      summary: Reporte de ocupación semanal

  /audit:
    get:
      summary: Logs de auditoría (dueño)

  /fhir/Patient:
    get:
      summary: Bundle FHIR Patient (stub interoperabilidad)

  /fhir/Practitioner:
    get:
      summary: Bundle FHIR Practitioner

  /fhir/Appointment:
    get:
      summary: Bundle FHIR Appointment

components:
  schemas:
    Patient:
      type: object
      properties:
        id: { type: string, format: uuid }
        clinicId: { type: string, format: uuid }
        givenName: { type: string }
        familyName: { type: string }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, nullable: true }
        identifier: { type: string, nullable: true }
        hasPortalAccess:
          type: boolean
          description: true si el paciente tiene cuenta de portal vinculada
        createdAt: { type: string, format: date-time }
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: smoothflow.sid

security:
  - sessionCookie: []
